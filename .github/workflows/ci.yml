name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1; then
              break
            fi
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"127.0.0.1:27017"}]}) }'
          for i in $(seq 1 30); do
            STATE=$(docker exec mongo mongosh --quiet --eval 'try { rs.status().myState } catch (e) { 0 }')
            if [ "$STATE" = "1" ]; then
              echo "Replica set PRIMARY ready"
              break
            fi
            sleep 1
          done

      - name: Install API deps
        working-directory: server
        run: npm install

      - name: Seed database
        working-directory: server
        run: npm run db:seed
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/worknest_test?replicaSet=rs0&directConnection=true
          JWT_SECRET: ci-test-secret-key-32-characters!
          CLIENT_ORIGIN: http://localhost:3000

      - name: Test
        working-directory: server
        run: npm test
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/worknest_test?replicaSet=rs0&directConnection=true
          JWT_SECRET: ci-test-secret-key-32-characters!
          CLIENT_ORIGIN: http://localhost:3000
          NODE_ENV: test

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client deps
        working-directory: client
        run: npm install
      - name: Build
        working-directory: client
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
